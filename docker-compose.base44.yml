services:
  web:
    image: python:3.12-slim
    working_dir: /app/webapp
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -ec "pip install --no-cache-dir --quiet 'fastapi>=0.110' 'uvicorn[standard]>=0.29' &&
              exec uvicorn main:app --host 0.0.0.0 --port 3000 --reload"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
